name: Build RedDimensity 8400-Ultra APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.5 (Anti-504 CDN) & Build APK
        run: |
          set -e
          echo "=== 1. Menerima Lisensi Android SDK ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          echo "=== 2. Mengunduh Gradle 8.5 via Global CDN (Anti-504 + Auto-Retry) ==="
          curl --retry 5 --retry-delay 3 --retry-all-errors -fL \
            "https://downloads.gradle-dn.com/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip \
          || curl --retry 5 --retry-delay 3 --retry-all-errors -fL \
            "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip

          unzip -q -o /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.5/bin:$PATH"
          gradle -v

          echo "=== 3. Mencari Lokasi Folder Proyek & Compile APK ==="
          FOUND_SETTINGS=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$FOUND_SETTINGS" ]; then
            echo "ERROR: File settings.gradle.kts tidak ditemukan di repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
          echo "Folder proyek ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedDimensity-8400Ultra-GameSpace-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
