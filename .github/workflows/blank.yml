name: Build RedDimensity 8400-Ultra APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5 (Multi-Mirror Tanpa gradle.org) & Build APK
        run: |
          set -e
          echo "=== 1. Menerima Lisensi Android SDK ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          echo "=== 2. Mengunduh Gradle 8.5 dari 4 Mirror Independen (Bebas 504 gradle.org) ==="
          MIRRORS=(
            "https://distfiles.macports.org/gradle/gradle-8.5-bin.zip"
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.5-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-8.5-bin.zip"
          )

          DOWNLOAD_OK=0
          for URL in "${MIRRORS[@]}"; do
            echo "Mencoba unduh dari mirror: $URL"
            if curl -fL --connect-timeout 15 --max-time 180 --retry 2 "$URL" -o /tmp/gradle.zip; then
              echo "BERHASIL mengunduh Gradle 8.5 dari: $URL"
              DOWNLOAD_OK=1
              break
            else
              echo "Mirror $URL gagal, pindah ke mirror cadangan berikutnya..."
            fi
          done

          if [ "$DOWNLOAD_OK" -eq 0 ]; then
            echo "ERROR: Semua mirror gagal dihubungi!"
            exit 1
          fi

          unzip -q -o /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.5/bin:$PATH"
          gradle -v

          echo "=== 3. Mencari Folder Proyek & Compile APK ==="
          FOUND_SETTINGS=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$FOUND_SETTINGS" ]; then
            echo "ERROR: File settings.gradle.kts tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
          cd "$PROJECT_DIR"

          # Hapus gradlePluginPortal() agar tidak menghubungi server gradle.org yang sedang error 504
          sed -i '/gradlePluginPortal()/d' settings.gradle.kts || true

          # Pastikan ic_launcher_round.xml tersedia
          if [ -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" ] && [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" ]; then
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedDimensity-8400Ultra-GameSpace-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
